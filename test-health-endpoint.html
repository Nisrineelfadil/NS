<!DOCTYPE html>
<html>
<head>
    <title>Health Endpoint Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #FFCC00;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Health Endpoint Test</h1>
    
    <button onclick="testHealth()">Test /api/health</button>
    <button onclick="testLogin()">Test /api/grades/student/login</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'https://nisrine-school.vercel.app';
        
        function showResult(message, type = 'success') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testHealth() {
            clearResults();
            showResult('🔄 Testing /api/health...', 'success');
            
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Health endpoint working!`, 'success');
                    showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    showResult(`⚠️ Health endpoint returned error: ${response.status}`, 'error');
                    showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
                
            } catch (error) {
                showResult(`❌ Health test failed: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            clearResults();
            showResult('🔄 Testing /api/grades/student/login...', 'success');
            
            try {
                const response = await fetch(`${API_URL}/api/grades/student/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test123'
                    })
                });
                
                const data = await response.json();
                
                showResult(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, response.ok ? 'success' : 'error');
                
            } catch (error) {
                showResult(`❌ Login test failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
