<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2 API Test - Nisrine School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-left: 10px;
        }

        .status.active {
            background: #4ade80;
            color: white;
        }

        .status.archived {
            background: #94a3b8;
            color: white;
        }

        .item {
            background: #f8fafc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .item h3 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .item p {
            color: #64748b;
            margin: 5px 0;
            font-size: 0.95em;
        }

        .icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .group-list {
            margin-left: 20px;
            margin-top: 10px;
        }

        .group-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border-left: 3px solid #f59e0b;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 50px;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #dc2626;
        }

        .success {
            background: #d1fae5;
            color: #059669;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #059669;
        }

        .eval-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 10px;
        }

        .eval-approved {
            background: #d1fae5;
            color: #059669;
        }

        .eval-mid {
            background: #fef3c7;
            color: #d97706;
        }

        .eval-failed {
            background: #fee2e2;
            color: #dc2626;
        }

        .login-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #1e293b;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Phase 2 API Test Dashboard</h1>

        <!-- Login Section -->
        <div class="login-section">
            <h2>🔐 Admin Login</h2>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter admin username">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter admin password">
            </div>
            <button onclick="login()">Login & Load Data</button>
            <div id="loginStatus"></div>
        </div>

        <div id="content" style="display: none;">
            <!-- Seasons Section -->
            <div class="card">
                <h2>📅 Seasons</h2>
                <div id="seasons-content">
                    <div class="loading">Loading seasons...</div>
                </div>
            </div>

            <!-- Branch Groups Section -->
            <div class="card">
                <h2>🎓 Branch Groups</h2>
                <div id="branch-groups-content">
                    <div class="loading">Loading branch groups...</div>
                </div>
            </div>

            <!-- Hierarchical Structure -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>🌳 Hierarchical Structure</h2>
                <div id="hierarchy-content">
                    <div class="loading">Loading hierarchy...</div>
                </div>
            </div>

            <!-- Sample Grades with Visual Evaluation -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>📊 Sample Grades (Visual Evaluation)</h2>
                <div id="grades-content">
                    <div class="loading">Loading grades...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('loginStatus');

            if (!username || !password) {
                statusDiv.innerHTML = '<div class="error">Please enter username and password</div>';
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    authToken = data.token;
                    statusDiv.innerHTML = '<div class="success">✅ Login successful! Loading data...</div>';
                    document.getElementById('content').style.display = 'block';
                    loadAllData();
                } else {
                    statusDiv.innerHTML = '<div class="error">❌ Login failed: ' + (data.message || 'Invalid credentials') + '</div>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }

        async function loadAllData() {
            await loadSeasons();
            await loadBranchGroups();
            await loadHierarchy();
            await loadSampleGrades();
        }

        async function loadSeasons() {
            try {
                const response = await fetch('/api/seasons', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const seasons = await response.json();

                let html = '';
                if (seasons.length === 0) {
                    html = '<p style="color: #64748b;">No seasons found</p>';
                } else {
                    seasons.forEach(season => {
                        html += `
                            <div class="item">
                                <h3>
                                    📅 ${season.name}
                                    <span class="status ${season.status}">${season.status.toUpperCase()}</span>
                                </h3>
                                <p><strong>Start:</strong> ${new Date(season.startDate).toLocaleDateString()}</p>
                                <p><strong>End:</strong> ${new Date(season.endDate).toLocaleDateString()}</p>
                                <p><strong>Groups:</strong> ${season.groupCount || 0} language groups</p>
                                ${season.description ? `<p><strong>Description:</strong> ${season.description}</p>` : ''}
                            </div>
                        `;
                    });
                }
                document.getElementById('seasons-content').innerHTML = html;
            } catch (error) {
                document.getElementById('seasons-content').innerHTML = 
                    `<div class="error">Error loading seasons: ${error.message}</div>`;
            }
        }

        async function loadBranchGroups() {
            try {
                const response = await fetch('/api/branch-groups', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const branchGroups = await response.json();

                let html = '';
                if (branchGroups.length === 0) {
                    html = '<p style="color: #64748b;">No branch groups found</p>';
                } else {
                    branchGroups.forEach(bg => {
                        html += `
                            <div class="item">
                                <h3>
                                    <span class="icon">${bg.icon}</span>
                                    ${bg.displayName}
                                    <span class="status ${bg.status}">${bg.status.toUpperCase()}</span>
                                </h3>
                                <p><strong>Formation:</strong> ${bg.formation}</p>
                                <p><strong>Type:</strong> ${bg.type}</p>
                                <p><strong>Subgroups:</strong> ${bg.subgroupCount || 0}</p>
                                ${bg.description ? `<p><strong>Description:</strong> ${bg.description}</p>` : ''}
                            </div>
                        `;
                    });
                }
                document.getElementById('branch-groups-content').innerHTML = html;
            } catch (error) {
                document.getElementById('branch-groups-content').innerHTML = 
                    `<div class="error">Error loading branch groups: ${error.message}</div>`;
            }
        }

        async function loadHierarchy() {
            try {
                const response = await fetch('/api/branch-groups/hierarchy/all', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const hierarchy = await response.json();

                let html = '<div class="grid">';

                // Seasons section
                html += '<div>';
                html += '<h3 style="color: #667eea; margin-bottom: 15px;">📁 Seasons (Language Groups)</h3>';
                if (hierarchy.seasons && hierarchy.seasons.length > 0) {
                    hierarchy.seasons.forEach(seasonData => {
                        html += `
                            <div class="item">
                                <h3>📅 ${seasonData.season.name}</h3>
                                <div class="group-list">
                        `;
                        if (seasonData.groups && seasonData.groups.length > 0) {
                            seasonData.groups.forEach(group => {
                                html += `
                                    <div class="group-item">
                                        <strong>${group.name}</strong> - ${group.formation}
                                        <br><small>${group.currentStudentCount}/${group.maxStudents} students</small>
                                    </div>
                                `;
                            });
                        } else {
                            html += '<p style="color: #64748b; margin-left: 10px;">No groups yet</p>';
                        }
                        html += '</div></div>';
                    });
                } else {
                    html += '<p style="color: #64748b;">No seasons found</p>';
                }
                html += '</div>';

                // Branch groups section
                html += '<div>';
                html += '<h3 style="color: #667eea; margin-bottom: 15px;">🎓 Branch Groups (Subject Groups)</h3>';
                if (hierarchy.branches && hierarchy.branches.length > 0) {
                    hierarchy.branches.forEach(branchData => {
                        html += `
                            <div class="item">
                                <h3>${branchData.branchGroup.icon} ${branchData.branchGroup.displayName}</h3>
                                <div class="group-list">
                        `;
                        if (branchData.groups && branchData.groups.length > 0) {
                            branchData.groups.forEach(group => {
                                html += `
                                    <div class="group-item">
                                        <strong>${group.name}</strong>
                                        <br><small>${group.currentStudentCount}/${group.maxStudents} students</small>
                                    </div>
                                `;
                            });
                        } else {
                            html += '<p style="color: #64748b; margin-left: 10px;">No subgroups yet</p>';
                        }
                        html += '</div></div>';
                    });
                } else {
                    html += '<p style="color: #64748b;">No branch groups found</p>';
                }
                html += '</div>';

                html += '</div>';
                document.getElementById('hierarchy-content').innerHTML = html;
            } catch (error) {
                document.getElementById('hierarchy-content').innerHTML = 
                    `<div class="error">Error loading hierarchy: ${error.message}</div>`;
            }
        }

        async function loadSampleGrades() {
            try {
                // This would need a specific endpoint or student ID
                // For now, showing a message
                document.getElementById('grades-content').innerHTML = `
                    <div class="success">
                        <h3>✅ Visual Evaluation System Active!</h3>
                        <p>All 33 existing grades have been updated with visual evaluation:</p>
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            <li><span class="eval-badge eval-approved">✅ APPROVED</span> - Score ≥ 70%</li>
                            <li><span class="eval-badge eval-mid">⚠️ MID</span> - Score 50-69%</li>
                            <li><span class="eval-badge eval-failed">❌ FAILED</span> - Score < 50%</li>
                        </ul>
                        <p style="margin-top: 15px;">Each grade now includes auto-generated comments based on performance!</p>
                        <p style="margin-top: 10px;"><em>To see actual grades, log in to the Student Portal or Teacher Portal.</em></p>
                    </div>
                `;
            } catch (error) {
                document.getElementById('grades-content').innerHTML = 
                    `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // Allow Enter key to submit login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
