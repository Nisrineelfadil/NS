<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #FFCC00;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Nisrine School API Connection Test</h1>
    
    <div>
        <button onclick="testConnection()">Test API Connection</button>
        <button onclick="testLogin()">Test Student Login</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_URL = 'https://nisrine-school.vercel.app';
        
        function showResult(message, type = 'loading') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function testConnection() {
            document.getElementById('results').innerHTML = '';
            showResult('🔄 Testing API connection...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/api/grades/student/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                showResult(`✅ API is reachable! Status: ${response.status}`, 'success');
                showResult(`<pre>${JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries())
                }, null, 2)}</pre>`, 'success');
                
            } catch (error) {
                showResult(`❌ Connection failed: ${error.message}`, 'error');
                showResult(`<pre>${error.stack}</pre>`, 'error');
            }
        }
        
        async function testLogin() {
            document.getElementById('results').innerHTML = '';
            showResult('🔄 Testing login endpoint...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/api/grades/student/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@nisrineschool.com',
                        password: 'test123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Login endpoint working! Response:`, 'success');
                } else {
                    showResult(`⚠️ Login endpoint responded (expected failure with test credentials):`, 'success');
                }
                
                showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                
            } catch (error) {
                showResult(`❌ Login test failed: ${error.message}`, 'error');
                showResult(`<pre>${error.stack}</pre>`, 'error');
            }
        }
    </script>
</body>
</html>
